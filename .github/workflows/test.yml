# The TextMate grammars and the Rok library against the shared corpus.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  textmate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  rok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rok
        run: |
          curl -fsSL https://rok-lang.org/install.sh | ROK_NO_MODIFY_PATH=1 sh -s -- -q
          echo "$HOME/.rok/bin" >> "$GITHUB_PATH"
      - run: rok fmt --check
      - run: rok test
